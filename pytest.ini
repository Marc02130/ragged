[pytest]
testpaths = tests
pythonpath = . api
markers =
    unit: fast tests with no Docker
    uat: user-acceptance against the Compose stack
    dogfood: live operator walkthrough of the running stack
    slice01: Compose scaffold
    slice02: Alembic schema
    slice03: auth API
    slice04: threads API
    slice05: document ingest
    slice06: RAG messages
    slice07: Webpack SPA foundation
    slice08: app shell
    slice09: README and smoke
    slice10: delete legacy trees
addopts = -q -m "unit"
